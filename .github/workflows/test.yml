name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Clone plenary.nvim
        run: git clone --depth=1 https://github.com/nvim-lua/plenary.nvim /tmp/plenary.nvim

      - name: Run tests
        run: |
          nvim --headless \
            --cmd "set runtimepath+=/tmp/plenary.nvim" \
            --cmd "set runtimepath+=$(pwd)" \
            -c "PlenaryBustedDirectory tests/plenary/ { minimal_init = '' }"
